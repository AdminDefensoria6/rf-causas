<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d5e7f8">
<title>Expedientes Asignados - Fioravante</title>

<!-- Firebase (configuración original) -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{--sky-1:#e6f1fc;--sky-2:#d5e7f8;--sky-3:#c6dcf3;--glow:#f5faff;--ink:#0c2a60;--muted:#46607f;--pill:rgba(255,255,255,.55);--pill-line:rgba(12,42,96,.14);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(18px,4vh,36px);padding:clamp(14px,3vh,28px) 20px 24px;font-family:var(--sans);color:var(--ink);
background:radial-gradient(60% 48% at 50% 44%,var(--glow) 0%,rgba(245,250,255,0) 72%),radial-gradient(45% 40% at 100% 100%,var(--sky-3) 0%,rgba(198,220,243,0) 70%),linear-gradient(160deg,var(--sky-1) 0%,var(--sky-2) 58%,var(--sky-3) 100%);background-color:var(--sky-2);overflow-x:hidden}

.fade{opacity:0;filter:blur(6px);transition:opacity 1s ease,filter 1s ease;transition-delay:calc(var(--i,0) * 180ms)}
.reveal.show .fade{opacity:1;filter:none}
.reveal{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,28px)}
.reveal:not(.show){pointer-events:none}

/* ── Ingreso ── */
.login{flex:1;width:100%;max-width:360px;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3.4vh,28px)}
.head{display:flex;flex-direction:column;align-items:center;gap:8px}
.sys{margin:0;text-align:center;font:italic 700 clamp(21px,3.2vw,28px)/1.2 var(--serif);color:var(--ink);text-wrap:balance}
.sub{margin:0;text-align:center;font:italic 500 clamp(19px,2.8vw,23px)/1.2 var(--serif);color:var(--muted)}
.inst{margin:2px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--muted)}
.inst span{display:block;opacity:.85}
.fields{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;align-items:center;gap:6px}
.field label{font:italic 500 17px/1.2 var(--serif);color:var(--muted)}
.field input{width:100%;height:52px;padding:0 20px;border:1px solid var(--pill-line);border-radius:999px;background:var(--pill);color:var(--ink);text-align:center;outline:none;-webkit-appearance:none;appearance:none;font:500 16px/1 var(--sans);transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease}
.field input::placeholder{color:var(--muted);opacity:.6}
.field input:focus{background:rgba(255,255,255,.88);border-color:var(--ink);box-shadow:0 4px 16px rgba(12,42,96,.06)}
.show-pass{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer;-webkit-user-select:none;user-select:none}
.show-pass input{width:16px;height:16px;margin:0;accent-color:var(--ink)}
.show-pass input:focus-visible,.version-text:focus-visible,.enter:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.enter{appearance:none;width:100%;height:52px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer;font:italic 700 clamp(20px,3vw,22px)/1 var(--serif);letter-spacing:.02em;box-shadow:0 6px 18px rgba(12,42,96,.22);transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}
.enter:hover{background:#143a80;transform:translateY(-1px);box-shadow:0 10px 22px rgba(12,42,96,.26)}
.enter:active{transform:none}

/* Pie: fecha, hora y versión */
.foot{margin:auto 0 0;padding-top:10px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 18px;font-size:12.5px;color:var(--muted)}
.fecha-actual{color:var(--ink);font-weight:500}
.hora-actual{font-variant-numeric:tabular-nums}
.version-text{appearance:none;border:0;background:none;padding:2px 0;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s ease}
.version-text:hover{color:var(--ink)}

/* Mensajes (toast) */
.auth-message-global{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500;z-index:5000;display:none;box-shadow:0 10px 26px rgba(12,42,96,.3);text-align:center;max-width:85vw}
.auth-message-global.error{background:#a61e2d}
.auth-message-global.success{background:#0f6b4a}

/* Créditos flotantes */
.version-info-container{position:fixed;bottom:calc(52px + env(safe-area-inset-bottom,0px));right:12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.82);border:1px solid var(--pill-line);border-radius:14px;padding:6px 8px 6px 12px;z-index:6000;opacity:0;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease;pointer-events:none;box-shadow:0 8px 22px rgba(12,42,96,.12)}
.version-info-container.show{opacity:1;transform:none;pointer-events:auto}
.version-text-left{display:flex;flex-direction:column;font-size:11px;line-height:1.25;color:var(--muted);white-space:nowrap}
.version-text-left .nombre{font:italic 700 15px/1.2 var(--serif);color:var(--ink)}
.version-image-right{width:34px;height:34px;flex-shrink:0;border-radius:10px;overflow:hidden;border:1px solid var(--pill-line)}
.version-image-right img{width:100%;height:100%;object-fit:cover;display:block}

/* Spinner (se conserva del original) */
#spinnerCarga{display:none;position:fixed;inset:0;background:rgba(213,231,248,.72);backdrop-filter:blur(4px);z-index:99999;align-items:center;justify-content:center;pointer-events:none}
.spinner-wrapper{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.spinner-circle{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(12,42,96,.15);border-top-color:var(--ink);animation:spinCircle 1s linear infinite}
.spinner-text{font-size:12px;font-weight:600;color:var(--ink)}
@keyframes spinCircle{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){.fade,.enter,.version-info-container{transition:none}.enter:hover{transform:none}}
</style>
</head>
<body>
  <section class="reveal" id="reveal">
    <div class="login">
      <div class="head">
        <h1 class="sys fade" id="welcomeMessage" style="--i:0">Hola, Rómulo Fioravante</h1>
        <p class="sub fade" id="sistemaDigitalText" style="--i:1">Expedientes Asignados</p>
        <p class="inst fade" style="--i:2">Defensoría Oficial Civil y Comercial 6<span>Ministerio Público de Misiones</span></p>
      </div>
      <div class="fields">
        <div class="field fade" style="--i:3">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="usuario@mpmisiones.gob.ar" autocomplete="email" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="field fade" style="--i:3.6">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <label class="show-pass fade" style="--i:4.2"><input type="checkbox" id="mostrarLoginPass" /> Mostrar contraseña</label>
        <div class="fade" style="--i:4.8"><button type="button" class="enter" id="btnLoginAction">Entrar al sistema</button></div>
      </div>
    </div>
    <footer class="foot fade" id="mainFooter" style="--i:5.6">
      <span class="fecha-actual" id="currentDateText"></span>
      <span class="hora-actual" id="currentTimeText"></span>
      <button type="button" class="version-text" id="versionText">Versión 11.2026</button>
    </footer>
  </section>

  <div id="spinnerCarga">
    <div class="spinner-wrapper"><div class="spinner-circle"></div><span class="spinner-text" id="spinnerText">0%</span></div>
  </div>

  <div id="globalAuthMessage" class="auth-message-global" role="status" aria-live="polite"></div>

  <div id="versionInfoContainer" class="version-info-container">
    <div class="version-text-left">
      <span>Diseño y Programación:</span>
      <span class="nombre">Rómulo Fioravante</span>
    </div>
    <div class="version-image-right">
      <img src="https://github.com/sistemadigital/iconos/blob/main/rf.png?raw=true" alt="Rómulo Fioravante" />
    </div>
  </div>

<script>
        // ======================== CONFIGURACIÓN FIREBASE (ORIGINAL) ========================
        const firebaseConfig = {
            apiKey: "AIzaSyAcylOv_wDD16HbYoTLvYj_Beaa1_MON0I",
            authDomain: "causasasignadas-def.firebaseapp.com",
            projectId: "causasasignadas-def",
            storageBucket: "causasasignadas-def.firebasestorage.app",
            messagingSenderId: "132961250045",
            appId: "1:132961250045:web:bda0f739c463217a056c94"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Configuración de dominio por defecto (para facilitar escritura)
        const DEFAULT_DOMAIN = "@mpmisiones.gob.ar";

        // Variable de estado para evitar redirección no deseada
        let isLoggingIn = false;

        // Función para mostrar mensajes tipo toast
        function showMessage(msg, type) {
            const div = document.getElementById('globalAuthMessage');
            div.textContent = msg;
            div.className = 'auth-message-global';
            if (type === 'error') div.classList.add('error');
            else if (type === 'success') div.classList.add('success');
            div.style.display = 'block';
            setTimeout(() => {
                div.style.display = 'none';
                div.classList.remove('error', 'success');
            }, 4000);
        }

        // Formatear email: si no tiene @, se agrega el dominio por defecto
        function formatEmail(input) {
            let email = input.trim();
            if (email && !email.includes('@')) {
                email += DEFAULT_DOMAIN;
            }
            return email;
        }

        // ========== LOGIN ==========
        window.loginUser = async function() {
            const rawEmail = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const email = formatEmail(rawEmail);

            if (!email || !password) {
                showMessage('Completa todos los campos', 'error');
                return;
            }
            try {
                isLoggingIn = true;
                await auth.signInWithEmailAndPassword(email, password);
                showMessage('Acceso concedido. Redirigiendo...', 'success');
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1500);
            } catch (error) {
                isLoggingIn = false;
                let errorMsg = 'Credenciales inválidas';
                if (error.code === 'auth/user-not-found') errorMsg = 'No existe una cuenta con este correo';
                else if (error.code === 'auth/wrong-password') errorMsg = 'Contraseña incorrecta';
                else if (error.code === 'auth/invalid-email') errorMsg = 'Formato de correo inválido';
                showMessage(errorMsg, 'error');
            }
        };

        // Redirección si ya está autenticado (evita bucle)
        auth.onAuthStateChanged((user) => {
            if (user && !isLoggingIn && (window.location.pathname.includes('index.html') || window.location.pathname === '/' || window.location.pathname === '')) {
                window.location.href = 'app.html';
            }
        });

        // ========== FORMULARIO DE INGRESO ==========
        // Acción del botón login
        document.getElementById('btnLoginAction').addEventListener('click', () => loginUser());

        // Mostrar/ocultar contraseña en modal login
        const mostrarLoginCheck = document.getElementById('mostrarLoginPass');
        const loginPassInput = document.getElementById('loginPassword');
        mostrarLoginCheck.addEventListener('change', () => {
            loginPassInput.type = mostrarLoginCheck.checked ? 'text' : 'password';
        });

        // Enter para login
        const loginEmailInput = document.getElementById('loginEmail');
        const loginPasswordInput = document.getElementById('loginPassword');
        const handleLoginEnter = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginUser();
            }
        };
        loginEmailInput.addEventListener('keypress', handleLoginEnter);
        loginPasswordInput.addEventListener('keypress', handleLoginEnter);

        // ========== POPUP VERSIÓN ==========
        const versionText = document.getElementById('versionText');
        const versionContainer = document.getElementById('versionInfoContainer');
        let popupTimeout = null;

        function cerrarPopup() {
            versionContainer.classList.remove('show');
            if (popupTimeout) {
                clearTimeout(popupTimeout);
                popupTimeout = null;
            }
        }

        function mostrarPopupConTimeout() {
            if (versionContainer.classList.contains('show')) {
                if (popupTimeout) {
                    clearTimeout(popupTimeout);
                    popupTimeout = null;
                }
                popupTimeout = setTimeout(() => {
                    cerrarPopup();
                }, 3000);
            } else {
                versionContainer.classList.add('show');
                if (popupTimeout) {
                    clearTimeout(popupTimeout);
                    popupTimeout = null;
                }
                popupTimeout = setTimeout(() => {
                    cerrarPopup();
                }, 3000);
            }
        }

        versionText.addEventListener('click', function(e) {
            e.stopPropagation();
            if (versionContainer.classList.contains('show')) {
                cerrarPopup();
            } else {
                mostrarPopupConTimeout();
            }
        });

        document.addEventListener('click', function(e) {
            if (window.innerWidth > 768 && versionContainer.classList.contains('show')) {
                if (!versionContainer.contains(e.target) && e.target !== versionText) {
                    cerrarPopup();
                }
            }
        });

        // ========== FECHA Y HORA ==========
        function actualizarFechaYHora() {
            const ahora = new Date();
            
            const opcionesFecha = { day: '2-digit', month: 'long', year: 'numeric' };
            let fechaString = ahora.toLocaleDateString('es-ES', opcionesFecha);
            const partesFecha = fechaString.split(' de ');
            if (partesFecha.length === 3) {
                 partesFecha[1] = partesFecha[1].charAt(0).toUpperCase() + partesFecha[1].slice(1);
            }
            document.getElementById('currentDateText').textContent = partesFecha.join(' de ');

            const opcionesHora = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const horaString = ahora.toLocaleTimeString('es-ES', opcionesHora);
            document.getElementById('currentTimeText').textContent = horaString;
        }
        
        setInterval(actualizarFechaYHora, 1000);
        actualizarFechaYHora();

        // ========== AVISO DE CRÉDITOS ==========
        // Se muestra al aparecer el ingreso
        function autoShowVersion() {
            setTimeout(() => {
                if (!versionContainer.classList.contains('show')) {
                    mostrarPopupConTimeout();
                }
            }, 600);
        }
        
</script>
<script>
/* El ingreso aparece directo: fundido escalonado, créditos y foco en el correo */
(() => {
  const reveal = document.getElementById('reveal');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    reveal.classList.add('show');
    autoShowVersion();
    if (matchMedia('(pointer: fine)').matches) setTimeout(() => loginEmailInput.focus({ preventScroll: true }), 900);
  }));
})();
</script>
</body>
</html>
