<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Expedientes Asignados - Fioravante</title>

    <!-- Firebase (configuración original) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <!-- Tipografía del sistema (igual que modulos.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <style>
/* ========== ESTILO VISUAL: mismo sistema que modulos.html ========== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}
:root{--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ink:#0b1f3a;--mut:#64748b;--bd:#e2e8f0;--bg:#eef1f6;--card:#fff;--ac:#2563eb;--ac2:#4f46e5;--ease:cubic-bezier(.16,1,.3,1);--c-ind:#4f46e5;--c-grn:#065f46;--lc:color-mix(in srgb,var(--c-ind) 14%,var(--bd));--glow:color-mix(in srgb,var(--c-ind) 32%,transparent);--shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);--btn:linear-gradient(135deg,#4f46e5,#4338ca);color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--ink:#e6eeff;--mut:#93a7cb;--bd:#1f3560;--bg:#071225;--card:#0f213f;--ac:#60a5fa;--ac2:#818cf8;--c-ind:#818cf8;--c-grn:#34d399;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.6);color-scheme:dark}}

*{margin:0;padding:0;box-sizing:border-box}
button,input{font-family:inherit}

body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}

main{flex:1;background:transparent;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-bottom:0;z-index:1}

#homeContent{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden;position:relative}

#dynamicContent{width:100%;flex-shrink:0}

@keyframes orbit{to{--ang:360deg}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}

.welcome-container{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;animation:fadeInUp .6s var(--ease) backwards;background:transparent;padding:10px 20px 0 20px;width:100%;position:relative}

/* Barra de bienvenida: píldora con borde fino, igual que las tarjetas de módulos */
.welcome-bar{display:flex;flex-direction:row;align-items:center;gap:1rem;background:var(--card);padding:.75rem 1.6rem;border-radius:999px;box-shadow:var(--shadow);border:1.5px solid var(--lc);width:100%;justify-content:space-between;cursor:default;transition:box-shadow .35s,border-color .35s}
.welcome-bar:hover{border-color:color-mix(in srgb,var(--c-ind) 30%,var(--bd));box-shadow:0 1px 2px rgba(15,23,42,.05),0 20px 40px -22px var(--glow)}

.left-group{display:flex;align-items:center;gap:1rem}

/* Texto con el mismo degradado del botón Ingresar */
.welcome-message,
.sistema-digital-text,
.mobile-greeting{
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1.15;
    background:var(--btn);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
}

.welcome-message{font-size:1.8rem;white-space:nowrap}

.sistema-digital-text{font-size:1.8rem;white-space:nowrap;margin-left:auto}

/* ===== Centro: logo con el arco de luz orbitando ===== */
.top-image-container{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:0;overflow:hidden;cursor:default}

.image-wrapper{display:flex;flex-direction:column;align-items:center;max-width:80%;max-height:80%;justify-content:center;position:relative}

.img-wrapper{--a1:#06b6d4;--a2:#818cf8;--a3:#4338ca;--ang:0deg;--arc:70deg;position:relative;display:inline-block;border-radius:50%;cursor:pointer;outline:none;width:100%;max-width:280px;aspect-ratio:1/1;flex-shrink:0;border:3px solid transparent;
background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box;
box-shadow:var(--shadow);animation:orbit 9s linear infinite,fadeInUp .6s var(--ease) .12s backwards;transition:transform .35s var(--ease),box-shadow .35s,--arc .5s}
.img-wrapper:hover,.img-wrapper:focus-visible{--arc:150deg;transform:translateY(-4px);box-shadow:0 1px 2px rgba(15,23,42,.05),0 30px 56px -24px var(--glow)}
.img-wrapper:focus-visible{outline:2px solid var(--ac);outline-offset:6px}

.img-3d{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;pointer-events:none}

/* ===== Saludo inferior (solo móvil) ===== */
.mobile-greeting{display:none;text-align:center;padding:8px 16px 0 16px;flex-shrink:0;background:transparent}

/* ===== Franja inferior: los colores del arco ===== */
.franja-azul{width:100%;height:8px;background:linear-gradient(90deg,#06b6d4,#818cf8,#4338ca);flex-shrink:0;z-index:10;margin-top:auto}

/* Spinner */
#spinnerCarga{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(4px);z-index:99999;align-items:center;justify-content:center;pointer-events:none}
.spinner-wrapper{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.spinner-circle{width:48px;height:48px;border-radius:50%;border:4px solid color-mix(in srgb,var(--c-ind) 18%,transparent);border-top-color:var(--c-ind);animation:spinCircle 1s linear infinite;position:absolute;top:0;left:0}
.spinner-text{font-size:12px;font-weight:700;color:var(--ink);z-index:2;user-select:none}
@keyframes spinCircle{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* Footer */
footer{height:70px;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0 20px;border-top:1.5px solid var(--bd);box-shadow:0 -12px 28px -22px rgba(15,23,42,.18);z-index:3000;flex-shrink:0;background:var(--card)}
.footer-content{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.footer-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fecha-actual{color:var(--ink);font-weight:700;font-size:.9rem;white-space:nowrap}

/* Hora: misma píldora "tag" de los módulos */
.btn-hora{display:inline-flex;align-items:center;justify-content:center;padding:.2rem .85rem;font-weight:700;font-size:.9rem;line-height:1.5;color:var(--c-ind);background:color-mix(in srgb,var(--c-ind) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c-ind) 30%,transparent);border-radius:999px;cursor:pointer;white-space:nowrap;transition:transform .35s var(--ease),box-shadow .35s,background .3s,color .3s}
.btn-hora:hover,.btn-hora:active{transform:translateY(-2px);background:var(--btn);color:#fff;box-shadow:0 14px 26px -14px var(--glow)}
.hora-actual{color:inherit;font-weight:700;font-size:.9rem;white-space:nowrap}

.footer-center{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.footer-center .btn-credenciales{padding:.5rem 1.7rem;font-weight:700;font-size:.9rem;color:#fff;background:var(--btn);border:none;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 10px 22px -12px var(--glow);transition:transform .35s var(--ease),box-shadow .35s,filter .3s}
.footer-center .btn-credenciales:hover,.footer-center .btn-credenciales:active{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 16px 28px -12px var(--glow)}

.btn-hora:focus-visible,.footer-center .btn-credenciales:focus-visible,.version-text:focus-visible,.btn-cerrar-modal:focus-visible,.btn-modal-primario:focus-visible{outline:2px solid var(--ac);outline-offset:4px}

.footer-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.version-text{font-weight:700;font-size:.9rem;color:var(--mut);cursor:pointer;transition:color .3s;user-select:none;white-space:nowrap}
.version-text:hover{color:var(--c-ind)}

/* Modal de login: tarjeta con arco orbitando mientras está abierta */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(2,6,23,.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:4000;visibility:hidden;opacity:0;transition:visibility .2s,opacity .3s var(--ease)}
.modal-overlay.active{visibility:visible;opacity:1}

.modal-contenido{--a1:#06b6d4;--a2:#818cf8;--a3:#4338ca;--ang:0deg;--arc:70deg;max-width:460px;width:90%;border-radius:32px;padding:2rem 1.8rem;position:relative;transform:scale(.96);transition:transform .4s var(--ease);text-align:center;border:1.5px solid transparent;
background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box;
box-shadow:0 1px 2px rgba(15,23,42,.05),0 30px 60px -24px var(--glow)}
.modal-overlay.active .modal-contenido{transform:scale(1);animation:orbit 9s linear infinite}

.btn-cerrar-modal{position:absolute;top:1.2rem;right:1.4rem;background:none;border:none;font-size:1.8rem;cursor:pointer;color:var(--mut);transition:color .2s;line-height:1;border-radius:8px}
.btn-cerrar-modal:hover{color:var(--ink)}

.modal-contenido h3{font-weight:800;font-size:1.8rem;letter-spacing:-.03em;line-height:1.15;color:var(--ink);margin-bottom:.4rem;text-wrap:balance}
.modal-contenido .modal-sub{color:var(--mut);font-weight:600;font-size:.95rem;margin-bottom:1.5rem;line-height:1.4}

.grupo-input{margin-bottom:1.2rem;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.grupo-input label{font-size:.8rem;font-weight:700;color:var(--mut)}
.grupo-input input{padding:14px 16px;border:1.5px solid var(--bd);border-radius:18px;font-size:.95rem;font-weight:500;font-family:var(--font);background:var(--card);transition:border-color .25s,box-shadow .25s;width:100%;max-width:320px;color:var(--ink);text-align:center}
.grupo-input input::placeholder{color:color-mix(in srgb,var(--mut) 70%,transparent)}
.grupo-input input:focus{outline:none;border-color:var(--c-ind);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-ind) 16%,transparent)}

.mostrar-clave{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--mut);margin:-5px 0 12px 0;cursor:pointer}
.mostrar-clave input{accent-color:var(--c-ind)}

.btn-modal-primario{width:100%;max-width:320px;padding:14px;background:var(--btn);color:#fff;border:none;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:8px;box-shadow:0 10px 22px -12px var(--glow);transition:transform .35s var(--ease),box-shadow .35s,filter .3s}
.btn-modal-primario:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 18px 30px -12px var(--glow)}

.enlace-modal{text-align:center;margin-top:1.2rem;font-size:.85rem;font-weight:600;color:var(--mut)}
.enlace-modal span{color:var(--c-ind);font-weight:700;cursor:pointer}
.enlace-modal span:hover{text-decoration:underline}

/* Mensajes (toast) */
.auth-message-global{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 24px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:5000;display:none;box-shadow:0 18px 36px -18px rgba(2,6,23,.55);text-align:center;max-width:85vw}
.auth-message-global.error{background:#b91c1c;color:#fff}
.auth-message-global.success{background:#047857;color:#fff}

/* Créditos flotantes (abajo a la derecha) */
.version-info-container{position:fixed;bottom:76px;right:10px;display:flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--lc);z-index:6000;opacity:0;transform:translateY(20px) scale(.95);transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none;padding:3px 5px 3px 8px}
.version-info-container.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.version-text-left{display:flex;flex-direction:column;justify-content:center;color:var(--mut);font-weight:500;font-size:.5rem;line-height:1.2;white-space:nowrap}
.version-text-left .nombre{font-weight:800;font-size:.6rem;color:var(--ink)}
.version-image-right{width:32px;height:32px;flex-shrink:0;border-radius:8px;overflow:hidden;border:1px solid var(--lc)}
.version-image-right img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
.welcome-bar{justify-content:center;padding:.55rem 1rem}
.left-group{display:none !important}
.sistema-digital-text{font-size:clamp(1.2rem,5vw,2rem);margin-left:0;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.mobile-greeting{display:block;font-size:clamp(1.2rem,5vw,2rem);padding:6px 16px 2px 16px;background:transparent;text-align:center;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.img-wrapper{max-width:240px}
footer{height:auto;min-height:60px;padding:8px 16px;flex-direction:column}
.footer-content{flex-direction:column;gap:6px;width:100%}
.footer-left{display:flex !important;flex-direction:row;justify-content:center;align-items:center;gap:10px;width:100%;order:1;flex-shrink:1;background:transparent;padding:0}
.footer-left .fecha-actual{color:var(--ink) !important;font-weight:700;font-size:.85rem;background:transparent;padding:0}
.footer-left .btn-hora{background:transparent !important;border:none !important;box-shadow:none !important;padding:0 !important;color:var(--c-ind) !important;font-weight:700;font-size:.85rem;transform:none !important;border-radius:0;display:inline-flex;align-items:center;justify-content:center}
.footer-left .btn-hora:hover,.footer-left .btn-hora:active{background:transparent !important;color:var(--ac) !important;transform:none !important;box-shadow:none !important}
.footer-left .hora-actual{color:inherit !important;font-weight:700;font-size:.85rem}
.footer-center{order:2;width:100%;flex:none;padding:4px 0}
.footer-center .btn-credenciales{width:100%;max-width:100%;font-size:.9rem;padding:.65rem 1.5rem;white-space:normal}
.footer-center .btn-credenciales:hover,.footer-center .btn-credenciales:active{transform:scale(.98)}
.footer-right{display:none}
.version-info-container{padding:2px 4px 2px 6px;gap:3px;border-radius:8px;bottom:70px}
.version-image-right{width:24px;height:24px;border-radius:6px}
.version-text-left{font-size:.4rem;line-height:1.1}
.version-text-left .nombre{font-size:.45rem}
}

@media (max-width:480px){
.img-wrapper{max-width:200px}
.footer-center .btn-credenciales{font-size:.85rem;padding:.55rem 1rem}
.modal-contenido{padding:1.2rem 1rem}
.modal-contenido h3{font-size:1.3rem}
.btn-modal-primario{font-size:.85rem;padding:11px}
.grupo-input input{padding:10px 14px;font-size:.85rem}
.version-info-container{padding:2px 3px 2px 5px;gap:2px}
.version-image-right{width:20px;height:20px}
.version-text-left{font-size:.35rem}
.version-text-left .nombre{font-size:.4rem}
}

@media (max-width:360px){
.img-wrapper{max-width:170px}
.sistema-digital-text{font-size:clamp(.9rem,4vw,1.2rem)}
.mobile-greeting{font-size:clamp(.9rem,4vw,1.2rem)}
.footer-center .btn-credenciales{font-size:.7rem;padding:.35rem .8rem}
.version-info-container{padding:2px 2px 2px 4px;gap:2px}
.version-image-right{width:18px;height:18px}
.version-text-left{font-size:.3rem}
.version-text-left .nombre{font-size:.35rem}
}

@media(prefers-reduced-motion:reduce){
.img-wrapper,.modal-overlay.active .modal-contenido{animation:none;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box;transition:box-shadow .2s}
.modal-contenido{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box}
.welcome-container{animation:none}
.img-wrapper:hover,.img-wrapper:focus-visible{transform:none}
.btn-hora,.footer-center .btn-credenciales,.btn-modal-primario{transition:none}
.btn-hora:hover,.footer-center .btn-credenciales:hover,.btn-modal-primario:hover{transform:none}
}
    </style>
</head>
<body>

    <main>
        <div id="homeContent">
            <div id="dynamicContent">
                <div class="welcome-container">
                    <div class="welcome-bar" id="welcomeBar">
                        <div class="left-group" id="leftGroup">
                            <div>
                                <div class="welcome-message" id="welcomeMessage">Hola Rómulo Fioravante</div>
                            </div>
                        </div>
                        <span class="sistema-digital-text" id="sistemaDigitalText">Expedientes Asignados</span>
                    </div>
                </div>
            </div>

            <!-- Centro de la pantalla: imagen con el mismo tamaño que index -->
            <div class="top-image-container">
                <div class="image-wrapper">
                    <div class="img-wrapper" id="imagenAbrirLogin"
                         role="button"
                         tabindex="0"
                         aria-label="Abrir inicio de sesión"
                         title="Haz clic para acceder al sistema">
                        <img src="https://github.com/sistemadigital/iconos/blob/main/rf.png?raw=true"
                             alt="Sistema Digital Defensoría"
                             class="img-3d">
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenedor del saludo inferior (solo visible en móvil) -->
        <div class="mobile-greeting" id="mobileGreeting">Hola Rómulo Fioravante</div>

        <!-- Franja inferior azul vibrante -->
        <div class="franja-azul"></div>
    </main>

    <div id="spinnerCarga">
        <div class="spinner-wrapper">
            <div class="spinner-circle"></div>
            <span class="spinner-text" id="spinnerText">0%</span>
        </div>
    </div>

    <footer id="mainFooter">
        <div class="footer-content">
            <div class="footer-left">
                <span class="fecha-actual" id="currentDateText"></span>
                <button class="btn-hora"><span class="hora-actual" id="currentTimeText"></span></button>
            </div>
            <div class="footer-center">
                <button class="btn-credenciales" id="btnFooterCredenciales">Ingresa tus credenciales para comenzar</button>
            </div>
            <div class="footer-right">
                <span class="version-text" id="versionText">Versión 11.2026</span>
            </div>
        </div>
    </footer>

    <!-- MODAL LOGIN -->
    <div id="modalLogin" class="modal-overlay">
        <div class="modal-contenido">
            <button class="btn-cerrar-modal" id="cerrarModalLoginBtn">&times;</button>
            <h3>Expedientes Asignados</h3>
            <p class="modal-sub">Defensoría Oficial Civil y Comercial 6<br><span style="font-weight:400;font-size:0.85rem;">Ministerio Público de Misiones</span></p>
            <div>
                <div class="grupo-input">
                    <label>Correo electrónico</label>
                    <input type="email" id="loginEmail" placeholder="usuario@mpmisiones.gob.ar" autocomplete="email" />
                </div>
                <div class="grupo-input">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
                </div>
                <label class="mostrar-clave">
                    <input type="checkbox" id="mostrarLoginPass" /> Mostrar contraseña
                </label>
                <button class="btn-modal-primario" id="btnLoginAction">Entrar al sistema</button>
            </div>
        </div>
    </div>

    <div id="globalAuthMessage" class="auth-message-global"></div>

    <!-- Modal flotante inferior derecho (más pequeño) -->
    <div id="versionInfoContainer" class="version-info-container">
        <div class="version-text-left">
            <span>Diseño y Programación:</span>
            <span class="nombre">Rómulo Fioravante</span>
        </div>
        <div class="version-image-right">
            <img src="https://github.com/sistemadigital/iconos/blob/main/rf.png?raw=true" alt="Rómulo Fioravante" />
        </div>
    </div>

    <script>
        // ======================== CONFIGURACIÓN FIREBASE (ORIGINAL) ========================
        const firebaseConfig = {
            apiKey: "AIzaSyAcylOv_wDD16HbYoTLvYj_Beaa1_MON0I",
            authDomain: "causasasignadas-def.firebaseapp.com",
            projectId: "causasasignadas-def",
            storageBucket: "causasasignadas-def.firebasestorage.app",
            messagingSenderId: "132961250045",
            appId: "1:132961250045:web:bda0f739c463217a056c94"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Configuración de dominio por defecto (para facilitar escritura)
        const DEFAULT_DOMAIN = "@mpmisiones.gob.ar";

        // Variable de estado para evitar redirección no deseada
        let isLoggingIn = false;

        // Función para mostrar mensajes tipo toast
        function showMessage(msg, type) {
            const div = document.getElementById('globalAuthMessage');
            div.textContent = msg;
            div.className = 'auth-message-global';
            if (type === 'error') div.classList.add('error');
            else if (type === 'success') div.classList.add('success');
            div.style.display = 'block';
            setTimeout(() => {
                div.style.display = 'none';
                div.classList.remove('error', 'success');
            }, 4000);
        }

        // Formatear email: si no tiene @, se agrega el dominio por defecto
        function formatEmail(input) {
            let email = input.trim();
            if (email && !email.includes('@')) {
                email += DEFAULT_DOMAIN;
            }
            return email;
        }

        // ========== LOGIN ==========
        window.loginUser = async function() {
            const rawEmail = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const email = formatEmail(rawEmail);

            if (!email || !password) {
                showMessage('Completa todos los campos', 'error');
                return;
            }
            try {
                isLoggingIn = true;
                await auth.signInWithEmailAndPassword(email, password);
                showMessage('Acceso concedido. Redirigiendo...', 'success');
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1500);
            } catch (error) {
                isLoggingIn = false;
                let errorMsg = 'Credenciales inválidas';
                if (error.code === 'auth/user-not-found') errorMsg = 'No existe una cuenta con este correo';
                else if (error.code === 'auth/wrong-password') errorMsg = 'Contraseña incorrecta';
                else if (error.code === 'auth/invalid-email') errorMsg = 'Formato de correo inválido';
                showMessage(errorMsg, 'error');
            }
        };

        // Redirección si ya está autenticado (evita bucle)
        auth.onAuthStateChanged((user) => {
            if (user && !isLoggingIn && (window.location.pathname.includes('index.html') || window.location.pathname === '/' || window.location.pathname === '')) {
                window.location.href = 'app.html';
            }
        });

        // ========== MANEJO DE MODALES ==========
        const modalLogin = document.getElementById('modalLogin');

        function abrirModalLogin() {
            modalLogin.classList.add('active');
            document.getElementById('loginEmail').focus();
        }
        function cerrarModalLogin() {
            modalLogin.classList.remove('active');
        }

        // Botón cerrar
        document.getElementById('cerrarModalLoginBtn').addEventListener('click', cerrarModalLogin);

        // Cerrar al hacer clic fuera
        modalLogin.addEventListener('click', (e) => {
            if (e.target === modalLogin) cerrarModalLogin();
        });

        // Acción del botón login
        document.getElementById('btnLoginAction').addEventListener('click', () => loginUser());

        // Mostrar/ocultar contraseña en modal login
        const mostrarLoginCheck = document.getElementById('mostrarLoginPass');
        const loginPassInput = document.getElementById('loginPassword');
        mostrarLoginCheck.addEventListener('change', () => {
            loginPassInput.type = mostrarLoginCheck.checked ? 'text' : 'password';
        });

        // Enter para login
        const loginEmailInput = document.getElementById('loginEmail');
        const loginPasswordInput = document.getElementById('loginPassword');
        const handleLoginEnter = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginUser();
            }
        };
        loginEmailInput.addEventListener('keypress', handleLoginEnter);
        loginPasswordInput.addEventListener('keypress', handleLoginEnter);

        // ========== CLIC EN LA IMAGEN: ABRE MODAL LOGIN ==========
        const imagenWrapper = document.getElementById('imagenAbrirLogin');
        if (imagenWrapper) {
            imagenWrapper.addEventListener('click', (e) => {
                e.stopPropagation();
                abrirModalLogin();
            });
            // Accesibilidad: tecla Enter o Espacio
            imagenWrapper.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    e.stopPropagation();
                    abrirModalLogin();
                }
            });
        }

        // Cerrar modales con Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modalLogin.classList.contains('active')) cerrarModalLogin();
            }
        });

        // ========== FOOTER: BOTÓN CREDENCIALES ==========
        document.getElementById('btnFooterCredenciales').addEventListener('click', abrirModalLogin);

        // ========== POPUP VERSIÓN ==========
        const versionText = document.getElementById('versionText');
        const versionContainer = document.getElementById('versionInfoContainer');
        let popupTimeout = null;

        function cerrarPopup() {
            versionContainer.classList.remove('show');
            if (popupTimeout) {
                clearTimeout(popupTimeout);
                popupTimeout = null;
            }
        }

        function mostrarPopupConTimeout() {
            if (versionContainer.classList.contains('show')) {
                if (popupTimeout) {
                    clearTimeout(popupTimeout);
                    popupTimeout = null;
                }
                popupTimeout = setTimeout(() => {
                    cerrarPopup();
                }, 3000);
            } else {
                versionContainer.classList.add('show');
                if (popupTimeout) {
                    clearTimeout(popupTimeout);
                    popupTimeout = null;
                }
                popupTimeout = setTimeout(() => {
                    cerrarPopup();
                }, 3000);
            }
        }

        versionText.addEventListener('click', function(e) {
            e.stopPropagation();
            if (versionContainer.classList.contains('show')) {
                cerrarPopup();
            } else {
                mostrarPopupConTimeout();
            }
        });

        document.addEventListener('click', function(e) {
            if (window.innerWidth > 768 && versionContainer.classList.contains('show')) {
                if (!versionContainer.contains(e.target) && e.target !== versionText) {
                    cerrarPopup();
                }
            }
        });

        // ========== FECHA Y HORA ==========
        function actualizarFechaYHora() {
            const ahora = new Date();
            
            const opcionesFecha = { day: '2-digit', month: 'long', year: 'numeric' };
            let fechaString = ahora.toLocaleDateString('es-ES', opcionesFecha);
            const partesFecha = fechaString.split(' de ');
            if (partesFecha.length === 3) {
                 partesFecha[1] = partesFecha[1].charAt(0).toUpperCase() + partesFecha[1].slice(1);
            }
            document.getElementById('currentDateText').textContent = partesFecha.join(' de ');

            const opcionesHora = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const horaString = ahora.toLocaleTimeString('es-ES', opcionesHora);
            document.getElementById('currentTimeText').textContent = horaString;
        }
        
        setInterval(actualizarFechaYHora, 1000);
        actualizarFechaYHora();

        // ========== POSICIONAMIENTO DEL POPUP EN MÓVIL ==========
        function posicionarPopupDebajoDeWelcome() {
            const welcomeBar = document.getElementById('welcomeBar');
            if (window.innerWidth <= 768 && welcomeBar) {
                const rect = welcomeBar.getBoundingClientRect();
                const topPos = rect.bottom + 4;
                versionContainer.style.top = topPos + 'px';
                versionContainer.style.bottom = 'auto';
                versionContainer.style.right = 'auto';
                versionContainer.style.left = '50%';
                versionContainer.style.transform = 'translateX(-50%)';
            } else {
                versionContainer.style.top = '';
                versionContainer.style.bottom = '';
                versionContainer.style.right = '';
                versionContainer.style.left = '';
                versionContainer.style.transform = '';
            }
        }

        function autoShowVersion() {
            posicionarPopupDebajoDeWelcome();
            setTimeout(() => {
                if (!versionContainer.classList.contains('show')) {
                    mostrarPopupConTimeout();
                }
            }, 600);
        }

        window.addEventListener('load', autoShowVersion);
        window.addEventListener('resize', posicionarPopupDebajoDeWelcome);

        // También al hacer clic en versión en móvil
        versionText.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                posicionarPopupDebajoDeWelcome();
            }
        });
    </script>
</body>
</html>
