<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Judicial | Agente Rómulo Fioravante</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Tipografía del sistema (igual que modulos.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}
:root{--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ink:#0b1f3a;--mut:#64748b;--bd:#e2e8f0;--bg:#eef1f6;--card:#fff;--ac:#2563eb;--ac2:#4f46e5;--ease:cubic-bezier(.16,1,.3,1);--c-ind:#4f46e5;--c-grn:#065f46;--bad:#991b1b;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--ink:#e6eeff;--mut:#93a7cb;--bd:#1f3560;--bg:#071225;--card:#0f213f;--ac:#60a5fa;--ac2:#818cf8;--c-ind:#818cf8;--c-grn:#34d399;--bad:#f87171;color-scheme:dark}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding:max(30px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
button{font-family:inherit}

/* Contenedor principal */
.dashboard{max-width:1400px;margin:0 auto}

/* Encabezado */
.app-header{margin-bottom:36px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.title-section h1{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.15;color:var(--ink);text-wrap:balance}
.title-section p{color:var(--mut);margin-top:6px;font-size:.9rem;font-weight:600}

/* Botón imprimir: misma píldora "tag" de los módulos */
.print-btn{--accent:var(--c-ind);display:flex;align-items:center;gap:8px;padding:.55em 1.3em;font:700 .85rem/1.4 var(--font);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s,background .3s,color .3s}
.print-btn:hover,.print-btn:focus-visible{transform:translateY(-2px);background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;box-shadow:0 14px 26px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
.print-btn:focus-visible{outline:2px solid var(--ac);outline-offset:4px}

/* Grid de tarjetas: cada tarjeta es un "módulo" con arco de luz orbitando */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:48px}
.stat-card{--accent:var(--c-ind);--a1:#06b6d4;--a2:#818cf8;--a3:#4338ca;--tint:color-mix(in srgb,var(--accent) 10%,var(--card));--wash:color-mix(in srgb,var(--accent) 5%,var(--card));--lc:color-mix(in srgb,var(--accent) 14%,var(--bd));--glow:color-mix(in srgb,var(--accent) 32%,transparent);--ang:0deg;--arc:70deg;
position:relative;min-height:132px;padding:1.3rem 1.5rem 1.4rem;border-radius:28px;border:1.5px solid transparent;cursor:pointer;
background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box;
box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);animation:orbit 9s linear infinite,fadeInUp .6s var(--ease) backwards;transition:transform .35s var(--ease),box-shadow .35s,--arc .5s}
.stat-card:nth-child(even){--accent:var(--c-grn);--a1:#06b6d4;--a2:#10b981;--a3:#065f46;animation-delay:-4.5s,.12s}
.stat-card:nth-child(3){animation-delay:-2s,.06s}
.stat-card:nth-child(5){animation-delay:-6.5s,.18s}
@keyframes orbit{to{--ang:360deg}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
.stat-card:hover,.stat-card:focus-visible{--arc:150deg;transform:translateY(-4px);box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -20px var(--glow)}
.stat-card:focus-visible{outline:2px solid var(--ac);outline-offset:4px}

/* Tarjeta activa: el JS le pone estilos en línea (fondo/borde); acá se reemplazan por el arco abierto */
.stat-card[style]{background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box !important;border:1.5px solid transparent !important}
.stat-card[style*="189, 212, 232"]{--arc:150deg;background:linear-gradient(var(--wash),var(--wash)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box !important;box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -22px var(--glow)}

/* Total en la esquina: píldora "tag" */
.card-badge{position:absolute;top:18px;right:20px;padding:.2em .85em;font-size:1.2rem;font-weight:800;line-height:1.4;letter-spacing:-.02em;color:var(--accent);background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px}
.card-title{font-size:1.25rem;font-weight:800;letter-spacing:-.03em;line-height:1.2;color:var(--ink);margin-top:8px;margin-bottom:12px;padding-right:76px;text-wrap:balance}
.card-description{font-size:.82rem;font-weight:600;line-height:1.35;color:var(--mut);margin-top:24px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--accent) 14%,var(--bd))}

/* Panel del gráfico principal */
.chart-panel{--lc:color-mix(in srgb,var(--c-ind) 14%,var(--bd));padding:24px 28px 28px;border-radius:32px;border:1.5px solid var(--lc);background:var(--card);box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);animation:fadeInUp .6s var(--ease) .24s backwards}
.chart-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:1.5px solid var(--bd)}
.chart-header h3{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.chart-sub{padding:.2em .95em;font-size:.82rem;font-weight:700;line-height:1.6;color:var(--c-ind);background:color-mix(in srgb,var(--c-ind) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c-ind) 30%,transparent);border-radius:999px}
.chart-wrapper{position:relative;height:420px;width:100%}
.insight-note{margin-top:20px;padding:14px 20px;font-size:.85rem;font-weight:600;color:var(--mut);text-align:center;background:color-mix(in srgb,var(--c-ind) 6%,var(--card));border:1px solid color-mix(in srgb,var(--c-ind) 18%,var(--bd));border-radius:20px;text-wrap:balance}

/* Carga / error */
.loader-state{padding:40px;text-align:center;font-weight:700;color:var(--c-ind);background:var(--card);border:1.5px solid color-mix(in srgb,var(--c-ind) 14%,var(--bd));border-radius:32px}
.error-message{margin:20px 0;padding:18px 20px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:20px}

/* Impresión: sin animaciones y siempre en claro */
@media print{
:root{--ink:#0b1f3a;--mut:#64748b;--bd:#e2e8f0;--bg:#fff;--card:#fff}
body{background:#fff;padding:.5cm}
.print-btn,.cards-grid .stat-card{break-inside:avoid}
.stat-card,.chart-panel{animation:none !important;box-shadow:none !important}
.stat-card,.stat-card[style]{background:#fff !important;border:1px solid #ccc !important}
.chart-panel{border:1px solid #ccc}
.cards-grid{grid-template-columns:repeat(4,1fr)}
}

/* Responsive */
@media (max-width:720px){
body{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.chart-panel{padding:18px 16px 20px;border-radius:26px}
.chart-wrapper{height:340px}
.card-title{font-size:1.15rem}
.card-badge{font-size:1.05rem;top:14px;right:14px}
}

@media(prefers-reduced-motion:reduce){
.stat-card{animation:none;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box;transition:box-shadow .2s}
.stat-card:hover,.stat-card:focus-visible{transform:none}
.stat-card[style]{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box !important}
.stat-card[style*="189, 212, 232"]{background:linear-gradient(var(--wash),var(--wash)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box !important}
.chart-panel{animation:none}
.print-btn{transition:none}
.print-btn:hover,.print-btn:focus-visible{transform:none}
}
    </style>
</head>
<body>
<div class="dashboard">
    <div class="app-header">
        <div class="title-section">
            <h1>Reporte de Causas Asignadas</h1>
            <p>Agente Rómulo Fioravante · Datos dinámicos estadísticos</p>
        </div>
        <button class="print-btn" id="printViewBtn">🖨️ Imprimir resumen</button>
    </div>

    <!-- MÓDULOS TARJETA (sin iconos, con total en esquina superior derecha) -->
    <div class="cards-grid" id="cardsContainer">
        <!-- cada tarjeta se inyectará con JS dinámico pero estático con valores actualizados -->
    </div>

    <!-- Panel del gráfico (evolución según tarjeta seleccionada) -->
    <div class="chart-panel" id="chartPanel">
        <div class="chart-header">
            <h3 id="chartTitle">Reporte Mensual</h3>
            <div class="chart-sub" id="chartGranularityBadge">📅 Evolución mensual</div>
        </div>
        <div class="chart-wrapper">
            <canvas id="mainTimelineChart"></canvas>
        </div>
        <div class="insight-note" id="chartInsight">
            Haz clic en cualquier tarjeta para ver la evolución temporal de sus registros.
        </div>
    </div>

    <div id="loadingMessage" class="loader-state">⏳ Cargando expedientes desde Firebase ...</div>
    <div id="errorBox" class="error-message" style="display: none;"></div>
</div>

<script>
    /* Tema de los gráficos (solo presentación): tipografía y colores de los módulos */
    (function () {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = dark
            ? { ink: '#e6eeff', mut: '#93a7cb', grid: '#1f3560', card: '#0f213f', line: '#818cf8', fill: 'rgba(129, 140, 248, 0.10)', point: '#818cf8' }
            : { ink: '#0b1f3a', mut: '#64748b', grid: '#e2e8f0', card: '#ffffff', line: '#4f46e5', fill: 'rgba(79, 70, 229, 0.08)', point: '#4f46e5' };
        window.CHART_THEME = t;
        if (!window.Chart) return;
        var d = Chart.defaults;
        d.font.family = "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
        d.font.weight = 600;
        d.color = t.mut;
        d.borderColor = t.grid;
        d.plugins.legend.labels.color = t.ink;
        var tip = d.plugins.tooltip;
        tip.backgroundColor = dark ? '#e6eeff' : '#0b1f3a';
        tip.titleColor = dark ? '#0b1f3a' : '#ffffff';
        tip.bodyColor = dark ? '#0b1f3a' : '#ffffff';
        tip.cornerRadius = 12;
        tip.padding = 12;
    })();
</script>
<script>
    (function() {
        // ---------- CONFIGURACIÓN FIREBASE (igual a la original) ----------
        const firebaseConfig = {
            apiKey: "AIzaSyAcylOv_wDD16HbYoTLvYj_Beaa1_MON0I",
            authDomain: "causasasignadas-def.firebaseapp.com",
            projectId: "causasasignadas-def",
            storageBucket: "causasasignadas-def.firebasestorage.app",
            messagingSenderId: "132961250045",
            appId: "1:132961250045:web:bda0f739c463217a056c94"
        };

        let app;
        try {
            app = firebase.initializeApp(firebaseConfig);
        } catch (err) {
            console.warn("Firebase ya inicializado?", err);
            app = firebase.app();
        }
        const db = firebase.firestore();

        // ---------- Variables globales ----------
        let rawExpedientes = [];          // datos crudos
        let activeCardId = 'mensual';    // 'modo', 'estado', 'semanal', 'mensual', 'anual'
        let currentChart = null;          // instancia Chart.js
        
        // contenedores
        const cardsContainer = document.getElementById('cardsContainer');
        const loadingDiv = document.getElementById('loadingMessage');
        const errorDiv = document.getElementById('errorBox');
        const chartCanvas = document.getElementById('mainTimelineChart');
        const chartTitleSpan = document.getElementById('chartTitle');
        const chartGranularitySpan = document.getElementById('chartGranularityBadge');
        const chartInsightDiv = document.getElementById('chartInsight');

        // ----- 1. Procesamiento de datos: series temporales -----
        function parseFechaDDMMYYYY(fechaStr) {
            if (!fechaStr || typeof fechaStr !== 'string') return null;
            const partes = fechaStr.split('/');
            if (partes.length !== 3) return null;
            const [dia, mes, anio] = partes;
            const fecha = new Date(`${anio}-${mes}-${dia}`);
            return isNaN(fecha.getTime()) ? null : fecha;
        }

        // Agrupar por semana (año + número de semana ISO)
        function getWeekNumber(date) {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const week1 = new Date(d.getFullYear(), 0, 4);
            const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
            return `${d.getFullYear()}-S${weekNum}`;
        }

        // generar series: semanal, mensual (año-mes), anual
        function buildTimeSeries(data, tipo) {
            // tipo: 'semanal', 'mensual', 'anual'
            const map = new Map(); // key -> count
            for (const exp of data) {
                const fechaStr = exp.fechaPase;
                if (!fechaStr) continue;
                const fecha = parseFechaDDMMYYYY(fechaStr);
                if (!fecha) continue;
                let key = '';
                if (tipo === 'semanal') {
                    key = getWeekNumber(fecha);
                } else if (tipo === 'mensual') {
                    key = `${fecha.getFullYear()}-${String(fecha.getMonth()+1).padStart(2,'0')}`;
                } else { // anual
                    key = `${fecha.getFullYear()}`;
                }
                map.set(key, (map.get(key) || 0) + 1);
            }
            // ordenar claves cronológicamente
            const sortedKeys = Array.from(map.keys()).sort((a,b) => {
                if (tipo === 'semanal') return a.localeCompare(b);
                if (tipo === 'mensual') return a.localeCompare(b);
                return parseInt(a) - parseInt(b);
            });
            const values = sortedKeys.map(k => map.get(k));
            return { labels: sortedKeys, counts: values };
        }

        // series por categoría (modo de intervención) a nivel mensual
        function buildMonthlyCategorySeries(data, categoriaKey, posiblesValores) {
            // categoriaKey: 'modoIntervencion' o 'controlSecretario'
            // Retorna: { labelsMeses: string[], datasets: [{label, data}] }
            const mesesMap = new Map(); // key "YYYY-MM" -> { categoria1: count, categoria2: count ... }
            for (const exp of data) {
                const fechaStr = exp.fechaPase;
                if (!fechaStr) continue;
                const fecha = parseFechaDDMMYYYY(fechaStr);
                if (!fecha) continue;
                const mesKey = `${fecha.getFullYear()}-${String(fecha.getMonth()+1).padStart(2,'0')}`;
                let categoria = exp[categoriaKey];
                if (!categoria || categoria === 'Sin definir') categoria = 'No especificado';
                if (!mesesMap.has(mesKey)) mesesMap.set(mesKey, {});
                const inner = mesesMap.get(mesKey);
                inner[categoria] = (inner[categoria] || 0) + 1;
            }
            // ordenar meses cronológicos
            const sortedMeses = Array.from(mesesMap.keys()).sort();
            // para cada valor posible, construir array de datos
            const datasets = [];
            for (const val of posiblesValores) {
                const dataPorMes = sortedMeses.map(mes => mesesMap.get(mes)?.[val] || 0);
                datasets.push({
                    label: val,
                    data: dataPorMes,
                    borderColor: getColorForString(val),
                    backgroundColor: 'transparent',
                    tension: 0.2,
                    fill: false,
                    borderWidth: 2.5,
                    pointRadius: 3,
                    pointHoverRadius: 6
                });
            }
            return { labels: sortedMeses, datasets };
        }

        // colores consistentes
        function getColorForString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash<<5)-hash)+str.charCodeAt(i);
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 65%, 55%)`;
        }

        // obtener valores únicos de un campo de los expedientes
        function getUniqueValues(data, field) {
            const vals = new Set();
            data.forEach(d => {
                let v = d[field];
                if (!v || v === 'Sin definir') v = 'No especificado';
                vals.add(v);
            });
            return Array.from(vals).sort();
        }

        // ---- Módulo de renderizado de tarjetas (dinámicas con totales) ----
        function renderCards(totalCasos) {
            const cards = [
                { id: 'modo', title: '⚖️ Modo de Intervención', desc: 'Evolución mensual por tipo de intervención', tipo: 'categorical', categoryField: 'modoIntervencion' },
                { id: 'estado', title: '⚖️ Estado de Control', desc: 'Tendencia mensual según estado del secretario', tipo: 'categorical', categoryField: 'controlSecretario' },
                { id: 'semanal', title: '📆 Reporte Semanal', desc: 'Casos por semana (evolución)', tipo: 'temporal', granularidad: 'semanal' },
                { id: 'mensual', title: '📅 Reporte Mensual', desc: 'Total de causas mes a mes', tipo: 'temporal', granularidad: 'mensual' },
                { id: 'anual', title: '🗓️ Reporte Anual', desc: 'Distribución anual de asignaciones', tipo: 'temporal', granularidad: 'anual' }
            ];
            cardsContainer.innerHTML = '';
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'stat-card';
                cardDiv.setAttribute('data-card-id', card.id);
                // esquina superior derecha: total de causas global (número total)
                cardDiv.innerHTML = `
                    <div class="card-badge">${totalCasos}</div>
                    <div class="card-title">${card.title}</div>
                    <div class="card-description">${card.desc}</div>
                `;
                cardDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activateCard(card.id, card);
                });
                cardsContainer.appendChild(cardDiv);
            });
            // resaltar primera tarjeta activa por defecto: mensual
            const defaultCard = { id: 'mensual', title: '📅 Reporte Mensual', desc: 'Total de causas mes a mes', tipo: 'temporal', granularidad: 'mensual' };
            activateCard('mensual', defaultCard);
        }

        // función principal para actualizar gráfico según tarjeta seleccionada
        function activateCard(cardId, cardMeta) {
            activeCardId = cardId;
            if (!rawExpedientes.length) return;
            const total = rawExpedientes.length;
            // actualizar estilo visual de tarjetas (opcional)
            document.querySelectorAll('.stat-card').forEach(card => {
                card.style.background = '#ffffff';
                card.style.border = '1px solid #ffffff50';
            });
            const activeDiv = document.querySelector(`.stat-card[data-card-id="${cardId}"]`);
            if(activeDiv) activeDiv.style.background = '#fafdff', activeDiv.style.border = '1px solid #bdd4e8';

            // Generar gráfico según tipo
            if (cardMeta.tipo === 'categorical') {
                const field = cardMeta.categoryField;
                let uniqueVals = getUniqueValues(rawExpedientes, field);
                if(uniqueVals.length === 0) uniqueVals = ['Sin datos'];
                const { labels, datasets } = buildMonthlyCategorySeries(rawExpedientes, field, uniqueVals);
                if (labels.length === 0) {
                    chartTitleSpan.innerText = cardMeta.title;
                    chartGranularitySpan.innerText = '📅 Sin datos temporales';
                    if (currentChart) currentChart.destroy();
                    chartInsightDiv.innerText = 'No hay fechas válidas para mostrar evolución mensual. Verifica que los expedientes contengan fechaPase.';
                    return;
                }
                chartTitleSpan.innerText = cardMeta.title;
                chartGranularitySpan.innerText = '📈 Evolución mensual por categoría';
                if (currentChart) currentChart.destroy();
                const ctx = chartCanvas.getContext('2d');
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: { mode: 'index', intersect: false },
                            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                        },
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1, precision:0 }, title: { display: true, text: 'Cantidad de casos' } },
                            x: { title: { display: true, text: 'Mes (Año-Mes)' }, ticks: { maxRotation: 45, autoSkip: true } }
                        }
                    }
                });
                const insights = `Distribución mensual de ${cardMeta.title.toLowerCase()}. Se muestran ${datasets.length} categorías. Total de registros: ${total}.`;
                chartInsightDiv.innerText = insights;
            } 
            else if (cardMeta.tipo === 'temporal') {
                const granularidad = cardMeta.granularidad; // 'semanal', 'mensual', 'anual'
                const { labels, counts } = buildTimeSeries(rawExpedientes, granularidad);
                if (labels.length === 0) {
                    chartTitleSpan.innerText = cardMeta.title;
                    chartGranularitySpan.innerText = `⏳ Sin registros con fecha`;
                    if (currentChart) currentChart.destroy();
                    chartInsightDiv.innerText = 'No se encontraron expedientes con fechas válidas para este reporte.';
                    return;
                }
                chartTitleSpan.innerText = cardMeta.title;
                let granularText = '';
                if (granularidad === 'semanal') granularText = '📆 Evolución semanal';
                else if (granularidad === 'mensual') granularText = '📅 Evolución mensual';
                else granularText = '🗓️ Evolución anual';
                chartGranularitySpan.innerText = granularText;
                if (currentChart) currentChart.destroy();
                const ctx = chartCanvas.getContext('2d');
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Causas asignadas',
                            data: counts,
                            borderColor: CHART_THEME.line,
                            backgroundColor: CHART_THEME.fill,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.2,
                            pointBackgroundColor: CHART_THEME.point,
                            pointBorderColor: CHART_THEME.card,
                            pointRadius: 4,
                            pointHoverRadius: 7
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: { callbacks: { label: (ctx) => `${ctx.raw} casos` } },
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1, precision:0 }, title: { display: true, text: 'Número de expedientes' } },
                            x: { ticks: { maxRotation: 45, autoSkip: true }, title: { display: true, text: granularidad === 'semanal' ? 'Semana (Año-S#)' : (granularidad === 'mensual' ? 'Mes' : 'Año') } }
                        }
                    }
                });
                const totalPeriodos = labels.length;
                const maxCount = Math.max(...counts);
                chartInsightDiv.innerText = `📊 Reporte ${granularidad}: se analizan ${totalPeriodos} períodos. Pico máximo de ${maxCount} casos. Total causas: ${total}.`;
            }
        }

        // ----- Generar estadísticas rápidas para la impresión UI (modo impresión) -----
        function printSummary() {
            if (!rawExpedientes.length) {
                alert("Aún no hay datos cargados.");
                return;
            }
            const total = rawExpedientes.length;
            // Crear contenido imprimible
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head><title>Reporte oficial - Causas Rómulo Fioravante</title>
                <style>
                    body { font-family: 'Segoe UI', sans-serif; margin: 2cm; }
                    h1 { color: #0f3b5c; }
                    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
                    th { background: #eef2f7; }
                    .badge-total { font-size: 1.8rem; font-weight: bold; color: #236b9b; }
                </style>
                </head>
                <body>
                <h1>Reporte de Causas Judiciales Asignadas</h1>
                <p>Agente Rómulo Fioravante · Generado el ${new Date().toLocaleDateString()}</p>
                <p><strong>Total de causas cargadas:</strong> ${total}</p>
                <hr/>
                <h2>Resumen por Modo de Intervención</h2>
                ${generateSimpleTable(rawExpedientes, 'modoIntervencion')}
                <h2>Estado de Control</h2>
                ${generateSimpleTable(rawExpedientes, 'controlSecretario')}
                <h2>Distribución Anual</h2>
                ${generateTimeTable(rawExpedientes, 'anual')}
                <h2>Distribución Mensual (últimos meses)</h2>
                ${generateTimeTable(rawExpedientes, 'mensual', 12)}
                <hr/>
                <footer>Sistema de análisis - Datos sincronizados desde Firebase</footer>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        function generateSimpleTable(data, field) {
            const stats = new Map();
            data.forEach(d => {
                let val = d[field];
                if (!val || val === 'Sin definir') val = 'No especificado';
                stats.set(val, (stats.get(val) || 0) + 1);
            });
            const sorted = Array.from(stats.entries()).sort((a,b) => b[1]-a[1]);
            let html = '<table><thead><tr><th>Categoría</th><th>Cantidad</th><th>Porcentaje</th></tr></thead><tbody>';
            const total = data.length;
            sorted.forEach(([key, count]) => {
                const pct = ((count/total)*100).toFixed(1);
                html += `<tr><td>${key}</td><td>${count}</td><td>${pct}%</td></tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        function generateTimeTable(data, tipo, maxItems = null) {
            const { labels, counts } = buildTimeSeries(data, tipo);
            let combined = labels.map((l,idx) => ({ label: l, count: counts[idx] }));
            combined.sort((a,b)=>b.count - a.count);
            if(maxItems) combined = combined.slice(0, maxItems);
            let html = '<table><thead><tr><th>Periodo</th><th>Cantidad</th></tr></thead><tbody>';
            combined.forEach( item => {
                html += `<tr><td>${item.label}</td><td>${item.count}</td></tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        // ----- Cargar datos desde Firebase -----
        async function fetchDataAndInit() {
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            try {
                const snapshot = await db.collection('expedientes').get();
                if (snapshot.empty) {
                    loadingDiv.innerHTML = '⚠️ No se encontraron expedientes en la colección "expedientes". Verifica Firestore.';
                    return;
                }
                const docs = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return {
                        modoIntervencion: data.modoIntervencion || 'Sin definir',
                        controlSecretario: data.controlSecretario || 'Sin estado',
                        fechaPase: data.fechaPase || null,
                        fechaControl: data.fechaControl || null
                    };
                });
                rawExpedientes = docs;
                loadingDiv.style.display = 'none';
                const totalCasos = rawExpedientes.length;
                // Renderizar tarjetas con total real
                renderCards(totalCasos);
                // Forzar activar por defecto: reporte mensual 
                const defaultCardMeta = { id: 'mensual', title: '📅 Reporte Mensual', desc: 'Total de causas mes a mes', tipo: 'temporal', granularidad: 'mensual' };
                activateCard('mensual', defaultCardMeta);
            } catch (err) {
                console.error(err);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerText = `Error al conectar con Firebase: ${err.message}. Verifica tu conexión y reglas de Firestore.`;
            }
        }

        // botón imprimir
        document.getElementById('printViewBtn').addEventListener('click', () => {
            if(rawExpedientes.length) printSummary();
            else alert("Esperando carga de datos...");
        });

        fetchDataAndInit();
    })();
</script>
</body>
</html>
